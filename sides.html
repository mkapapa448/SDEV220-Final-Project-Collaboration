{% load static %}
{% extends 'ordering/ordering.html' %}
{% block content %}
    <div class="category-banner"><img src="{% static 'ordering/images/sides.jpg' %}" alt="Sides food photograph"></div>

    <h1>Sides Menu</h1>


    {% for name, price in sides.items %}

        <p>
            {{ name }} - ${{ price|floatformat:2 }}
        </p>
        
        <form method="POST" action="{% url 'add_order' %}">
            {% csrf_token %}

            <input type="hidden" name="item_name" value="{{ name }}">
            <input type="hidden" name="category" value="sides">
            <button type="submit">Add to Order</button>
        </form>

    {% endfor %}
{% endblock %}
