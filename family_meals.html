{% load static %}
{% extends 'ordering/ordering.html' %}
{% block content %}
    <div class="category-banner"><img src="{% static 'ordering/images/familymeals.jpg' %}" alt="Family Meals food photograph"></div>

    <h1>Family Meals</h1>


    {% for name, price in family_meals.items %}
    
        <p>
            {{ name }} - ${{ price|floatformat:2 }}
        </p>
        
        <form method="POST" action="{% url 'add_order' %}">
            {% csrf_token %}

            <input type="hidden" name="item_name" value="{{ name }}">
            <input type="hidden" name="category" value="family_meals">
            <button type="submit">Add to Order</button>
        </form>

    {% endfor %}
{% endblock %}
